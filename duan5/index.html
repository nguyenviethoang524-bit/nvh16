<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Interactive Photo Gallery</h1>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Beautiful mountain landscape"
            onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
            alt="Peaceful lake surrounded by mountains" onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
            alt="Mountain lake and green forest" onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?w=600"
            alt="Wildlife in a natural landscape" onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600" alt="Snow-covered mountain peaks"
            onmouseover="upDate(this)" onmouseout="undo()">

        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600"
            alt="Sunlight shining through a forest" onmouseover="upDate(this)" onmouseout="undo()">
    </div>

    <script src="script.js"></script>
</body>

</html>
